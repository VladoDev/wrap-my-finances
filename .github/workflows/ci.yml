name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # TEMPORARY job: generates Linux-native `ci` golden references so they can
  # be downloaded and committed. Golden images must be generated on the same
  # OS that verifies them (see test/flutter_test_config.dart) — this repo's
  # developers are on macOS, so the committed images need to come from this
  # runner instead. Remove this job once the goldens/ci/*.png files are
  # updated and committed.
  generate-linux-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update goldens
        run: flutter test --update-goldens test/core/design_system/widgets/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-goldens
          path: test/core/design_system/widgets/goldens/
